version: '3'
services:
  dnsmasq:
    container_name: ns_host
    image: alpine-dnsmasq
    build: ../../..
    restart: always
    network_mode: host
    volumes:
      - ./etc/hosts:/etc/hosts:ro
      - ./etc/resolv.conf:/etc/resolv.conf:ro
      - ./etc/dnsmasq.conf:/etc/dnsmasq.conf:ro
    cap_add:
      - NET_ADMIN
